# A reusable workflow for the release workflow of a dataset repository: a git
# repository of TimeToShare manifests and the tables they name, released by
# release-please (README, "Versions of a dataset"). The dataset's release job
# runs after this one (`needs:`), so a release is tagged only when the check
# passes. It runs `timetoshare release-check`:
#
# - A push is a release when the version in .release-please-manifest.json is
#   not 0.0.0 and has no tag v<version> yet: the push that merges a release
#   pull request, before release-please tags it. The job compares the latest
#   version tag reachable from HEAD (the empty tree where there is none) with
#   HEAD, with the history of every tag, and fails when a finding is refused
#   (an ID given again), when a finding is undetermined (a table that cannot be
#   compared, a manifest that no longer reads), or when the release from the
#   tag's version (0.0.0 without one) to the new one allows a lower step than
#   the data requires (below 1.0.0 a removal raises the middle number, an
#   addition the last). The remedy is a commit whose type says what the data
#   does, or a `Release-As:` footer.
# - Any other push reports the same comparison and never fails.
#
# Either way the findings and the verdict go to the job summary as well.
#
# The caller names the TimeToShare tag or commit whose package runs the check:
#
#   jobs:
#     check:
#       uses: TimeToAlign/TimeToShare/.github/workflows/dataset-release-check.yml@<tag>
#       with:
#         timetoshare-ref: <the same tag>
name: Dataset release check

on:
  workflow_call:
    inputs:
      timetoshare-ref:
        description: "The TimeToShare tag or commit whose Python package runs the check"
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Version step of the data
    runs-on: ubuntu-latest
    steps:
      # The caller's repository, with its whole history, every tag and the files
      # Git LFS keeps (tables are often kept there).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          lfs: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the timetoshare package
        env:
          TIMETOSHARE_REF: ${{ inputs.timetoshare-ref }}
        run: >-
          python -m pip install
          "timetoshare[tables] @ git+https://github.com/TimeToAlign/TimeToShare@${TIMETOSHARE_REF}#subdirectory=python"

      - name: The release allows the step the data requires
        run: timetoshare release-check --summary "$GITHUB_STEP_SUMMARY"
