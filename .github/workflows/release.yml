# release-please keeps one release pull request open, carrying the next version and its
# changelog entry. Merging it tags vX.Y.Z and creates the GitHub release; the publish
# job then checks that every version declaration carries X.Y.Z, tests and builds the
# Python and the npm package and publishes both. The docs job dispatches docs.yml with
# the tag, which publishes the release's documentation and the documents of its schema
# version (every file of schema/<version>/ and the catalogue's schema, assembled by
# scripts/check_published.py) in the release's folder of this repository's Pages site,
# and the org-site job adds the released documents to the organisation site, at the
# address each `$id` names (see decisions/0008-oidc-dual-package-release.md). PyPI is
# published through trusted publishing (OIDC), and so is npm; no registry token is
# stored. A manual run naming a release tag publishes that release again, skipping
# every file a registry already holds, and serves its documents again. A TimeToShare version is a
# schema version, so it is never computed from the commits: the commit that adds a
# schema version carries a `Release-As: X.Y.Z` footer (see CONTRIBUTING.md).
name: Release

on:
  push:
    branches: [main]
  # Lets a maintainer run release-please by hand, or publish an existing release tag
  # again after a failed publish.
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag to publish again, such as v0.1.0; empty runs release-please only"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release-please:
    name: Release pull request and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # Refuses to tag a merged release pull request whose version is not the
      # version every declaration in the repository carries. A merged release pull
      # request is the push that changes the version in an existing manifest.
      - name: A merged release pull request names the declared version
        run: |
          manifest_version() { python3 -c 'import json, sys; print(json.load(sys.stdin)["."])'; }
          before=$(git show HEAD^:.release-please-manifest.json 2>/dev/null | manifest_version || true)
          after=$(manifest_version < .release-please-manifest.json)
          if [ -n "$before" ] && [ "$before" != "$after" ]; then
            python3 scripts/check_versions.py --tag "v$after"
          fi
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to PyPI and npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || inputs.tag != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Version declarations carry the tag
        run: python3 scripts/check_versions.py --tag "$TAG"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
        working-directory: python
      - run: uv run ruff check . && uv run ruff format --check . && uv run pytest -q
        working-directory: python
      - name: Build the Python package
        run: uv build
        working-directory: python
      - name: Check the Python distributions
        run: uvx twine check --strict python/dist/*

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: js/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
        working-directory: js
      - run: pnpm lint && pnpm typecheck && pnpm test
        working-directory: js
      - run: pnpm build
        working-directory: js

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          # A re-run after a failed npm step finds the Python files published.
          skip-existing: true

      - name: Trusted publishing needs npm 11.5.1 or later
        run: npm install -g npm@latest
      # A re-run finds a version the registry already holds and publishes nothing.
      - name: Publish to npm
        run: |
          package=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if [ "$(npm view "$package@$version" version 2> /dev/null)" = "$version" ]; then
            echo "npm already holds $package@$version."
          else
            npm publish --provenance --access public
          fi
        working-directory: js

  docs:
    name: Publish the documentation and the schema documents of the release
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # A tag pushed with the workflow token starts no workflow, so the release's
      # folder of the documentation is published by dispatching docs.yml.
      - name: Dispatch the documentation build of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$TAG"

  org-site:
    name: Serve the released documents at their $id on the organisation site
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The default branch (on a manual run, the branch chosen in the dispatch form)
      # holds the assembling script; the documents are read from the release tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          path: timetoshare
      # The organisation site TimeToAlign/timetoalign.github.io serves
      # https://timetoalign.github.io/timetoshare/<version>/<document>, the lowercase
      # address every published document names as its `$id`. A Pages path is
      # case-sensitive, so the repository's own site at /TimeToShare/ cannot serve it.
      # The deploy key ORG_SITE_DEPLOY_KEY may push to that repository alone.
      - uses: actions/checkout@v7
        with:
          repository: TimeToAlign/timetoalign.github.io
          ssh-key: ${{ secrets.ORG_SITE_DEPLOY_KEY }}
          path: site
      # Adds the released documents (every file of the tag's schema/<version>/ and
      # the catalogue's schema, under that schema version, which the script alone
      # reads from the tag) to the organisation site's default branch, and commits
      # nothing when the site already holds them, so a re-run is harmless.
      - name: Add the released documents to the organisation site
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          python3 timetoshare/scripts/check_published.py --ref "$TAG" --out site/timetoshare
          cd site
          git add timetoshare
          if git diff --cached --quiet; then
            echo "The organisation site already serves the documents of $TAG."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "add the TimeToShare documents of $TAG"
          git push origin HEAD
