# Builds the documentation site and publishes it as one folder per version on
# the gh-pages branch, served at https://timetoalign.github.io/TimeToShare/:
#   push to main          -> dev/
#   push of a tag vX.Y.Z  -> X.Y.Z/, and stable/ when it is the newest release
#   manual run            -> a release tag vX.Y.Z publishes X.Y.Z/, main
#                            publishes dev/; any other ref is refused
# A release made by release-please is published by release.yml, which
# dispatches this workflow with its tag (a tag pushed with the workflow token
# does not start a run by itself). The folder of a release also serves the
# documents of its schema version (every file of schema/<version>/ and the
# catalogue's schema, assembled by scripts/check_published.py) beside the
# pages, at https://timetoalign.github.io/TimeToShare/<version>/<document>.
#
# The publishing script and the version menu (versions.js) are those of the
# timetoalign repository, which publishes its documentation the same way.
name: docs

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag (vX.Y.Z) or branch to build; empty builds the selected branch"
        required: false
        default: ""

permissions:
  contents: write

# One group per ref, so that a build of main never cancels a pending release
# build; the publishing step retries when another run moved gh-pages.
concurrency:
  group: docs-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sources to build
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          path: src

      - name: Check out the publishing script
        uses: actions/checkout@v7
        with:
          repository: TimeToAlign/TimeToAlign
          # timetoalign's publishing script at a reviewed commit; moving it is a
          # change of this file
          ref: db9817f53136888ad442ca384108bcf41c9ef7d7
          path: tools
          sparse-checkout: |
            docs/publish_site.py
            docs/versions.js
          sparse-checkout-cone-mode: false

      - name: Determine the version folder
        id: target
        working-directory: src
        env:
          REF: ${{ inputs.ref || github.ref }}
        run: |
          name="${REF#refs/tags/}"
          name="${name#refs/heads/}"
          if [[ "$name" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "tag=$name" >> "$GITHUB_OUTPUT"
            echo "message=docs: publish ${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [ "$name" = "main" ]; then
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "message=docs: publish dev at $(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Only main (dev/) and release tags vX.Y.Z (X.Y.Z/) are published, not '$name'."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/js/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: src/js/pnpm-lock.yaml

      # The one step that runs the site generator (see docs/building.md); it
      # leaves the built site in src/docs/_build/html.
      - name: Build the site
        working-directory: src
        run: |
          (cd js && pnpm install --frozen-lockfile)
          cd python
          uv sync --locked --group docs
          uv run --no-sync sphinx-build -W --keep-going -n -d ../docs/_build/doctrees ../docs ../docs/_build/html

      # The default branch holds the assembling script, which ci.yml keeps
      # compatible with every tag; the documents are read from the tag.
      - name: Check out the assembling script
        if: steps.target.outputs.tag != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          path: assemble

      # The documents land at the root of the release's folder, at the paths
      # the repository's Pages site has served them since the first release.
      # The script refuses a tag whose $id or $ref names a document not served;
      # a document whose name a page of the site already takes stops the job.
      - name: Add the schema documents of the release
        if: steps.target.outputs.tag != ''
        env:
          TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          python3 assemble/scripts/check_published.py --ref "$TAG" --out "$RUNNER_TEMP/schema"
          documents="$RUNNER_TEMP/schema/$VERSION"
          if [ ! -d "$documents" ]; then
            echo "::error::$TAG holds no schema version $VERSION."
            exit 1
          fi
          for document in "$documents"/*; do
            name=$(basename "$document")
            if [ -e "src/docs/_build/html/$name" ]; then
              echo "::error::The site already holds a page named $name."
              exit 1
            fi
            cp "$document" "src/docs/_build/html/$name"
          done

      # The branch is created only when the remote answers that it does not
      # exist (exit status 2); any other failure stops the job.
      - name: Check out gh-pages
        working-directory: src
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch origin gh-pages
            git worktree add -B gh-pages ../pages FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            git worktree add --orphan -b gh-pages ../pages
          fi

      # When the push is rejected because another run moved gh-pages, the
      # folder is published again on top of the fetched branch, so that the
      # root files are rebuilt from the folders actually present.
      - name: Publish the version folder and push gh-pages
        env:
          VERSION: ${{ steps.target.outputs.version }}
          MESSAGE: ${{ steps.target.outputs.message }}
        run: |
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898799+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            python3 tools/docs/publish_site.py src/docs/_build/html \
              --version "$VERSION" --pages pages --base-path /TimeToShare/ \
              --title "TimeToShare! documentation" --forward-from ""
            git -C pages add -A
            if git -C pages diff --cached --quiet; then
              echo "Nothing changed."
              exit 0
            fi
            git -C pages commit -m "$MESSAGE"
            if git -C pages push origin gh-pages; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); publishing again on the fetched gh-pages."
            git -C pages fetch origin gh-pages
            git -C pages reset --hard FETCH_HEAD
          done
          echo "::error::gh-pages kept moving; the folder was not published."
          exit 1
