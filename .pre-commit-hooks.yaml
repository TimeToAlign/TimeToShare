# The hooks a dataset repository installs from this repository (README,
# "Versions of a dataset"). pre-commit runs `pip install . ./python[tables]` in
# its clone of this repository: the root is an empty distribution (setup.py),
# and ./python, resolved in the clone, is the timetoshare package.
- id: timetoshare-commit-type
  name: write the commit type of the staged manifests
  description: Writes feat or remove! where the staged change of the manifests and tables adds, edits or removes, and suggests the type of any other change.
  entry: timetoshare hook prepare-commit-msg
  language: python
  additional_dependencies: ["./python[tables]"]
  stages: [prepare-commit-msg]
  pass_filenames: true
  always_run: true
  # Shows the suggested type and the hint to split a mixed commit, which
  # pre-commit hides otherwise.
  verbose: true
  minimum_pre_commit_version: "3.2.0"
- id: timetoshare-commit-check
  name: check the commit type against the staged manifests
  description: Refuses a commit message whose type gives a lower version step than the staged change requires.
  entry: timetoshare hook commit-msg
  language: python
  additional_dependencies: ["./python[tables]"]
  stages: [commit-msg]
  pass_filenames: true
  always_run: true
  # Shows the warnings of an accepted message, which pre-commit hides otherwise.
  verbose: true
  minimum_pre_commit_version: "3.2.0"
- id: timetoshare-validate
  name: validate the manifests
  description: Validates every staged manifest, a file named `<name>.tts.yaml`, `.tts.yml` or `.tts.json`.
  entry: timetoshare validate
  language: python
  additional_dependencies: ["./python[tables]"]
  stages: [pre-commit]
  files: \.tts\.(ya?ml|json)$
  pass_filenames: true
  # Shows the warnings of an accepted manifest, which pre-commit hides otherwise.
  verbose: true
  minimum_pre_commit_version: "3.2.0"
- id: timetoshare-registry
  name: check the non-event rows of the package's registry
  description: Refuses a commit whose registry's non-event rows disagree with the manifests, MatchClaim tables and Parse table of the package at the repository's root; `timetoshare registry` rewrites them.
  entry: timetoshare registry --check
  language: python
  additional_dependencies: ["./python[tables]"]
  stages: [pre-commit]
  pass_filenames: false
  always_run: true
  minimum_pre_commit_version: "3.2.0"
