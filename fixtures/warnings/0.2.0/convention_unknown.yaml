manifest:
  "@context":
    "@version": 1.1
    actor:
      "@id": "https://timetoalign.github.io/timetoshare/ns#actor"
      "@type": "@id"
    basis:
      "@id": "http://www.w3.org/ns/prov#hadPrimarySource"
      "@type": "@id"
    belief:
      "@id": "https://timetoalign.github.io/timetoshare/ns#belief"
      "@type": "@vocab"
    beliefs: "https://timetoalign.github.io/timetoshare/ns#beliefs"
    broad: "http://www.w3.org/2004/02/skos/core#broadMatch"
    children: "@included"
    close: "http://www.w3.org/2004/02/skos/core#closeMatch"
    date:
      "@id": "http://purl.org/dc/terms/date"
      "@type": "http://www.w3.org/2001/XMLSchema#date"
    exact: "http://www.w3.org/2004/02/skos/core#exactMatch"
    "false": "https://timetoalign.github.io/timetoshare/ns#False"
    groups: "@included"
    id: "@id"
    imported: "https://timetoalign.github.io/timetoshare/ns#Imported"
    inferred: "https://timetoalign.github.io/timetoshare/ns#Inferred"
    label: "http://www.w3.org/2000/01/rdf-schema#label"
    list: "@list"
    manual: "https://timetoalign.github.io/timetoshare/ns#Manual"
    match:
      "@id": "https://timetoalign.github.io/timetoshare/ns#match"
      "@type": "@vocab"
    method:
      "@id": "https://timetoalign.github.io/timetoshare/ns#method"
      "@type": "@vocab"
    narrow: "http://www.w3.org/2004/02/skos/core#narrowMatch"
    note: "http://www.w3.org/2000/01/rdf-schema#comment"
    property:
      "@id": "http://www.w3.org/1999/02/22-rdf-syntax-ns#predicate"
      "@type": "@vocab"
    provenance:
      "@reverse": "http://www.w3.org/1999/02/22-rdf-syntax-ns#subject"
    reconciled: "https://timetoalign.github.io/timetoshare/ns#Reconciled"
    regions: "@included"
    related: "http://www.w3.org/2004/02/skos/core#relatedMatch"
    service:
      "@id": "https://timetoalign.github.io/timetoshare/ns#service"
      "@type": "@id"
    stated_by:
      "@id": "http://www.w3.org/ns/prov#wasAttributedTo"
      "@type": "@id"
    statements: "@nest"
    timelines: "@included"
    "true": "https://timetoalign.github.io/timetoshare/ns#True"
    type: "@type"
    unlikely: "https://timetoalign.github.io/timetoshare/ns#Unlikely"
    value: "http://www.w3.org/1999/02/22-rdf-syntax-ns#object"
  flow_maps:
    -
      canonical: false
      chunks:
        - "#region_1"
        -
          gap: [2, 1]
        - "#region_2"
        - "#coda"
      convention: with_ossia
      id: "#flow_map_1"
      name: null
      timeline: "#score"
  groups: []
  measure_maps: []
  meta: {}
  name: null
  resources: []
  timelines:
    -
      children:
        -
          children: []
          conversion_maps: []
          flow_control: []
          id: "#coda"
          is_segment_line: false
          length: [4, 1]
          locked: true
          meta: {}
          name: null
          number_type: fraction
          offset: [12, 1]
          regions: []
          unit: quarters
      conversion_maps: []
      flow_control:
        -
          coordinate: [2, 1]
          id: "#jump_target_1"
          label: null
          manifestation: repeat_start
          meta: {}
          name: null
          role: jump_target
        -
          coordinate: [4, 1]
          id: "#jump_target_2"
          label: null
          manifestation: segno
          meta: {}
          name: null
          role: jump_target
        -
          coordinate: [8, 1]
          id: "#jump_1"
          label: Repeat
          meta: {}
          name: null
          role: jump
          targets:
            -
              determined: true
              label: null
              manifestation: repeat_end
              repeat_count: 1
              reset: true
              to: "#jump_target_1"
        -
          coordinate: [12, 1]
          ends:
            after:
              jump: "#jump_2"
          id: "#break_1"
          label: Fine
          manifestation: fine
          meta: {}
          name: null
          role: break
        -
          coordinate: [16, 1]
          id: "#jump_2"
          label: "D.S. al Fine"
          meta: {}
          name: null
          role: jump
          targets:
            -
              determined: true
              label: null
              manifestation: dal_segno_al_fine
              repeat_count: 1
              reset: false
              to: "#jump_target_2"
      id: "#score"
      is_segment_line: false
      length: [16, 1]
      locked: false
      meta: {}
      name: Score
      number_type: fraction
      regions:
        -
          end: [8, 1]
          id: "#region_1"
          meta: {}
          name: null
          start: [0, 1]
        -
          end: [16, 1]
          id: "#region_2"
          meta: {}
          name: null
          start: [8, 1]
      unit: quarters
    -
      children: []
      conversion_maps: []
      flow_control: []
      id: "#sketch"
      is_segment_line: false
      length: [8, 1]
      locked: false
      meta: {}
      name: Sketch
      number_type: fraction
      regions:
        -
          end: [8, 1]
          id: "#region_3"
          meta: {}
          name: null
          start: [0, 1]
      unit: quarters
  timetoshare: "0.2.0"
  virtual_timelines:
    -
      id: "#virtual_1"
      length: [30, 1]
      map: "#flow_map_1"
      name: null
      number_type: fraction
      timeline: "#score"
      unit: quarters
unknown_keys: []
warnings:
  -
    code: convention_unknown
    message: "'with_ossia' is no convention the format defines"
    path: [flow_maps, 0, convention]
