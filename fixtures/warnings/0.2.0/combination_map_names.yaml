manifest:
  "@context":
    "@version": 1.1
    actor:
      "@id": "https://timetoalign.github.io/timetoshare/ns#actor"
      "@type": "@id"
    basis:
      "@id": "http://www.w3.org/ns/prov#hadPrimarySource"
      "@type": "@id"
    belief:
      "@id": "https://timetoalign.github.io/timetoshare/ns#belief"
      "@type": "@vocab"
    beliefs: "https://timetoalign.github.io/timetoshare/ns#beliefs"
    broad: "http://www.w3.org/2004/02/skos/core#broadMatch"
    children: "@included"
    close: "http://www.w3.org/2004/02/skos/core#closeMatch"
    date:
      "@id": "http://purl.org/dc/terms/date"
      "@type": "http://www.w3.org/2001/XMLSchema#date"
    exact: "http://www.w3.org/2004/02/skos/core#exactMatch"
    "false": "https://timetoalign.github.io/timetoshare/ns#False"
    groups: "@included"
    id: "@id"
    imported: "https://timetoalign.github.io/timetoshare/ns#Imported"
    inferred: "https://timetoalign.github.io/timetoshare/ns#Inferred"
    label: "http://www.w3.org/2000/01/rdf-schema#label"
    list: "@list"
    manual: "https://timetoalign.github.io/timetoshare/ns#Manual"
    match:
      "@id": "https://timetoalign.github.io/timetoshare/ns#match"
      "@type": "@vocab"
    method:
      "@id": "https://timetoalign.github.io/timetoshare/ns#method"
      "@type": "@vocab"
    narrow: "http://www.w3.org/2004/02/skos/core#narrowMatch"
    note: "http://www.w3.org/2000/01/rdf-schema#comment"
    property:
      "@id": "http://www.w3.org/1999/02/22-rdf-syntax-ns#predicate"
      "@type": "@vocab"
    provenance:
      "@reverse": "http://www.w3.org/1999/02/22-rdf-syntax-ns#subject"
    reconciled: "https://timetoalign.github.io/timetoshare/ns#Reconciled"
    regions: "@included"
    related: "http://www.w3.org/2004/02/skos/core#relatedMatch"
    service:
      "@id": "https://timetoalign.github.io/timetoshare/ns#service"
      "@type": "@id"
    stated_by:
      "@id": "http://www.w3.org/ns/prov#wasAttributedTo"
      "@type": "@id"
    statements: "@nest"
    timelines: "@included"
    "true": "https://timetoalign.github.io/timetoshare/ns#True"
    type: "@type"
    unlikely: "https://timetoalign.github.io/timetoshare/ns#Unlikely"
    value: "http://www.w3.org/1999/02/22-rdf-syntax-ns#object"
  groups: []
  measure_maps:
    -
      id: "#measures"
      meta: {}
      name: null
      rows:
        -
          actual_length: [4, 1]
          count: 1
          end_repeat: false
          name: "1"
          nominal_length: [4, 1]
          number: 1
          qstamp: [0, 1]
          start_repeat: false
          time_signature: "4/4"
  meta: {}
  name: null
  timelines:
    -
      children: []
      conversion_maps:
        -
          id: "#cmap_1"
          maps:
            -
              id: "#step_1"
              name: quarters_to_seconds
              offset: 0
              scalar: [1, 2]
              source_unit: quarters
              target_unit: seconds
              type: LinearMap
            -
              id: "#step_2"
              name: seconds_to_minutes
              offset: 0
              scalar: [1, 60]
              source_unit: seconds
              target_unit: minutes
              type: LinearMap
          name: quarters_to_minutes
          source_unit: quarters
          target_unit: minutes
          type: ChainMap
        -
          extrapolate: constant
          id: "#cmap_10"
          kind: linear
          name: quarters_to_seconds
          source_unit: quarters
          target_unit: seconds
          type: TableMap
          x_values:
            - [0, 1]
            - [4, 1]
          y_values: [0.0, 2.5]
        -
          extrapolate: none
          id: "#cmap_11"
          kind: previous
          name: tempo
          source_unit: quarters
          target_unit: null
          type: TableMap
          x_values:
            - [0, 1]
            - [8, 1]
          y_values: [60, 72]
        -
          id: "#cmap_2"
          maps:
            beat:
              id: "#beat"
              measure_map: "#measures"
              name: null
              source_unit: quarters
              target_unit: null
              type: MeasureBeatMap
            label:
              id: "#section_label"
              name: null
              source_unit: quarters
              target_unit: null
              type: ConstantMap
              value: verse
          name: position
          names: [label, beat]
          source_unit: quarters
          target_unit: null
          type: CombinationMap
        -
          id: "#cmap_3"
          name: section
          source_unit: quarters
          target_unit: null
          type: ConstantMap
          value: [1, 2]
        -
          id: "#cmap_4"
          measure_map: "#measures"
          name: null
          source_unit: quarters
          target_unit: floating_measures
          type: FloatingMeasureMap
        -
          id: "#cmap_5"
          name: quarters_to_ticks
          offset: 0
          scalar: 480
          source_unit: quarters
          target_unit: ticks
          type: LinearMap
        -
          id: "#cmap_6"
          measure_map: "#measures"
          name: null
          source_unit: quarters
          target_unit: null
          type: MeasureBeatMap
        -
          id: "#cmap_7"
          measure_map: "#measures"
          name: null
          source_unit: quarters
          target_unit: null
          type: MeasureNumberMap
        -
          id: "#cmap_8"
          measure_map: "#measures"
          name: null
          source_unit: quarters
          target_unit: null
          type: MeasureRecordMap
        -
          breaks:
            - [0, 1]
            - [8, 1]
            - [16, 1]
          id: "#cmap_9"
          maps:
            -
              id: "#piece_1"
              name: null
              offset: 0
              scalar: [1, 2]
              source_unit: quarters
              target_unit: seconds
              type: LinearMap
            -
              id: "#piece_2"
              name: null
              offset: 2.0
              scalar: [1, 4]
              source_unit: quarters
              target_unit: seconds
              type: LinearMap
          name: quarters_to_seconds
          source_unit: quarters
          target_unit: seconds
          type: PiecewiseMap
      flow_control: []
      id: "#maps:quarters"
      is_segment_line: false
      length: [16, 1]
      locked: false
      meta: {}
      name: "Quarter-note maps"
      number_type: fraction
      regions: []
      unit: quarters
  timetoshare: "0.2.0"
unknown_keys:
  -
    key: names
    path: [timelines, 0, conversion_maps, 3]
warnings: []
