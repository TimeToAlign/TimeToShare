manifest:
  "@context":
    "@version": 1.1
    actor:
      "@id": "https://timetoalign.github.io/timetoshare/ns#actor"
      "@type": "@id"
    basis:
      "@id": "http://www.w3.org/ns/prov#hadPrimarySource"
      "@type": "@id"
    belief:
      "@id": "https://timetoalign.github.io/timetoshare/ns#belief"
      "@type": "@vocab"
    beliefs: "https://timetoalign.github.io/timetoshare/ns#beliefs"
    broad: "http://www.w3.org/2004/02/skos/core#broadMatch"
    children: "@included"
    close: "http://www.w3.org/2004/02/skos/core#closeMatch"
    date:
      "@id": "http://purl.org/dc/terms/date"
      "@type": "http://www.w3.org/2001/XMLSchema#date"
    exact: "http://www.w3.org/2004/02/skos/core#exactMatch"
    "false": "https://timetoalign.github.io/timetoshare/ns#False"
    groups: "@included"
    id: "@id"
    imported: "https://timetoalign.github.io/timetoshare/ns#Imported"
    inferred: "https://timetoalign.github.io/timetoshare/ns#Inferred"
    label: "http://www.w3.org/2000/01/rdf-schema#label"
    list: "@list"
    manual: "https://timetoalign.github.io/timetoshare/ns#Manual"
    match:
      "@id": "https://timetoalign.github.io/timetoshare/ns#match"
      "@type": "@vocab"
    method:
      "@id": "https://timetoalign.github.io/timetoshare/ns#method"
      "@type": "@vocab"
    narrow: "http://www.w3.org/2004/02/skos/core#narrowMatch"
    note: "http://www.w3.org/2000/01/rdf-schema#comment"
    property:
      "@id": "http://www.w3.org/1999/02/22-rdf-syntax-ns#predicate"
      "@type": "@vocab"
    provenance:
      "@reverse": "http://www.w3.org/1999/02/22-rdf-syntax-ns#subject"
    reconciled: "https://timetoalign.github.io/timetoshare/ns#Reconciled"
    regions: "@included"
    related: "http://www.w3.org/2004/02/skos/core#relatedMatch"
    service:
      "@id": "https://timetoalign.github.io/timetoshare/ns#service"
      "@type": "@id"
    stated_by:
      "@id": "http://www.w3.org/ns/prov#wasAttributedTo"
      "@type": "@id"
    statements: "@nest"
    timelines: "@included"
    "true": "https://timetoalign.github.io/timetoshare/ns#True"
    type: "@type"
    unlikely: "https://timetoalign.github.io/timetoshare/ns#Unlikely"
    value: "http://www.w3.org/1999/02/22-rdf-syntax-ns#object"
  flow_maps:
    -
      canonical: false
      chunks: ["#region_1", "#region_1", "#region_2"]
      id: "#flow_map_1"
      name: Repeated
      timeline: "#score"
    -
      canonical: false
      chunks: ["#region_3", "#region_3"]
      id: "#flow_map_2"
      name: Twice
      timeline: "#sketch"
  graphical:
    elisions: []
    matchstamps: []
    order:
      "#group_1": ["#score", "#sketch"]
    rules:
      -
        select:
          addresses:
            -
              id: "#score"
              part: [card]
        set:
          flow: "#flow_map_1"
      -
        select:
          addresses:
            -
              id: "#sketch"
              part: [card]
        set:
          flow: "#flow_map_2"
    styles: {}
    timestamps: []
  groups:
    -
      id: "#group_1"
      members: ["#score", "#sketch"]
      meta: {}
      name: null
  measure_maps: []
  meta: {}
  name: null
  resources: []
  timelines:
    -
      children: []
      conversion_maps: []
      flow_control: []
      id: "#recording"
      is_segment_line: false
      length: 10.0
      locked: false
      meta: {}
      name: Recording
      number_type: float
      regions: []
      unit: seconds
    -
      children: []
      conversion_maps: []
      flow_control: []
      id: "#score"
      is_segment_line: false
      length: [16, 1]
      locked: false
      meta: {}
      name: Score
      number_type: fraction
      regions:
        -
          end: [8, 1]
          id: "#region_1"
          meta: {}
          name: A
          start: [0, 1]
        -
          end: [16, 1]
          id: "#region_2"
          meta: {}
          name: B
          start: [8, 1]
      unit: quarters
    -
      children: []
      conversion_maps: []
      flow_control: []
      id: "#sketch"
      is_segment_line: false
      length: [8, 1]
      locked: false
      meta: {}
      name: Sketch
      number_type: fraction
      regions:
        -
          end: [8, 1]
          id: "#region_3"
          meta: {}
          name: C
          start: [0, 1]
      unit: quarters
  timetoshare: "0.2.0"
  virtual_timelines:
    -
      id: "#virtual_1"
      length: [24, 1]
      map: "#flow_map_1"
      name: "Score, repeated"
      number_type: fraction
      timeline: "#score"
      unit: quarters
unknown_keys: []
warnings:
  -
    code: flow_conflict
    message: "members 'score' and 'sketch' of 'group_1' state the flows 'flow_map_1' and 'flow_map_2': the frame is drawn as written"
    path: [groups, 0, members]
