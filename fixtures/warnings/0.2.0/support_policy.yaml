manifest:
  "@context":
    "@version": 1.1
    actor:
      "@id": "https://timetoalign.github.io/timetoshare/ns#actor"
      "@type": "@id"
    basis:
      "@id": "http://www.w3.org/ns/prov#hadPrimarySource"
      "@type": "@id"
    belief: "https://timetoalign.github.io/timetoshare/ns#beliefValue"
    beliefs: "https://timetoalign.github.io/timetoshare/ns#belief"
    broad: "http://www.w3.org/2004/02/skos/core#broadMatch"
    children: "@included"
    close: "http://www.w3.org/2004/02/skos/core#closeMatch"
    date:
      "@id": "http://purl.org/dc/terms/date"
      "@type": "http://www.w3.org/2001/XMLSchema#date"
    exact: "http://www.w3.org/2004/02/skos/core#exactMatch"
    groups: "@included"
    id: "@id"
    imported: "https://timetoalign.github.io/timetoshare/ns#Imported"
    inferred: "https://timetoalign.github.io/timetoshare/ns#Inferred"
    label: "http://www.w3.org/2000/01/rdf-schema#label"
    list: "@list"
    manual: "https://timetoalign.github.io/timetoshare/ns#Manual"
    match:
      "@id": "https://timetoalign.github.io/timetoshare/ns#match"
      "@type": "@vocab"
    method:
      "@id": "https://timetoalign.github.io/timetoshare/ns#method"
      "@type": "@vocab"
    narrow: "http://www.w3.org/2004/02/skos/core#narrowMatch"
    note: "http://www.w3.org/2000/01/rdf-schema#comment"
    property:
      "@id": "http://www.w3.org/1999/02/22-rdf-syntax-ns#predicate"
      "@type": "@vocab"
    provenance:
      "@reverse": "http://www.w3.org/1999/02/22-rdf-syntax-ns#subject"
    reconciled: "https://timetoalign.github.io/timetoshare/ns#Reconciled"
    regions: "@included"
    related: "http://www.w3.org/2004/02/skos/core#relatedMatch"
    service:
      "@id": "https://timetoalign.github.io/timetoshare/ns#service"
      "@type": "@id"
    stated_by:
      "@id": "http://www.w3.org/ns/prov#wasAttributedTo"
      "@type": "@id"
    statements: "@nest"
    timelines: "@included"
    type: "@type"
    value: "http://www.w3.org/1999/02/22-rdf-syntax-ns#object"
  graphical:
    order:
      "#group_1": ["#score", "#performance"]
      "#group_2": ["#page", "#excerpt"]
    rules: []
    styles: {}
    timestamps: []
  groups:
    -
      id: "#group_1"
      members: ["#performance", "#score"]
      meta: {}
      name: Performance
    -
      id: "#group_2"
      members: ["#excerpt", "#page"]
      meta: {}
      name: Facsimile
  id: "#bundle_1"
  measure_maps: []
  meta: {}
  name: Mixed
  support_policy: omit
  timelines:
    -
      children: []
      conversion_maps: []
      flow_control: []
      id: "#annotations"
      is_segment_line: false
      length: [8, 1]
      locked: false
      meta: {}
      name: null
      number_type: fraction
      regions: []
      unit: quarters
    -
      children: []
      conversion_maps: []
      flow_control: []
      id: "#page"
      is_segment_line: false
      length: [8, 1]
      locked: false
      meta: {}
      name: null
      number_type: fraction
      regions: []
      unit: quarters
    -
      children: []
      conversion_maps: []
      flow_control: []
      id: "#performance"
      is_segment_line: false
      length: [8, 1]
      locked: false
      meta: {}
      name: null
      number_type: fraction
      regions: []
      unit: quarters
    -
      children:
        -
          children: []
          conversion_maps: []
          flow_control: []
          id: "#excerpt"
          is_segment_line: false
          length: [4, 1]
          locked: false
          meta: {}
          name: null
          number_type: fraction
          offset: [2, 1]
          regions: []
          unit: quarters
      conversion_maps: []
      flow_control: []
      id: "#recording"
      is_segment_line: false
      length: [8, 1]
      locked: false
      meta: {}
      name: null
      number_type: fraction
      regions: []
      unit: quarters
    -
      children: []
      conversion_maps: []
      flow_control: []
      id: "#score"
      is_segment_line: false
      length: [8, 1]
      locked: false
      meta: {}
      name: null
      number_type: fraction
      regions: []
      unit: quarters
  timetoshare: "0.2.0"
unknown_keys:
  -
    key: support_policy
    path: []
warnings: []
