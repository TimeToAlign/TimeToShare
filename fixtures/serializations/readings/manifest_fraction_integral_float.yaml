timetoshare: "0.2.0"
timelines:
  - id: score
    unit: quarters
    length: [1, 1]
    children:
      - id: c_a
        unit: quarters
        offset: [1, 4]
        length: [1, 4]
      - id: c_b
        unit: quarters
        offset: [1, 8.0]
        length: [1, 8]
  - id: perf
    unit: seconds
    length: 1.0
    regions:
      - id: r_a
        start: 0.25
        end: 0.5
      - id: r_b
        start: [1, 8.0]
        end: 0.5
    flow_control:
      - id: f_a
        type: flow_marker
        manifestation: fine
        coordinate: [3.0, 16]
      - id: f_b
        type: flow_marker
        manifestation: fine
        coordinate: 0.15
