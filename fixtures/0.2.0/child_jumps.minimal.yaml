graphical:
  timestamps:
    -
      coordinate: [0, 1]
      display: [wedge, coordinate]
      id: "#timestamp_1"
      name: origin
      timeline: "#piece"
    -
      coordinate: [16, 1]
      display: [wedge, coordinate]
      id: "#timestamp_2"
      name: length
      timeline: "#piece"
meta:
  generator: "timetoalign 1.2.0 (aa91d4d5)"
timelines:
  -
    children:
      -
        flow_control:
          -
            coordinate: [2, 1]
            id: "#segno"
            manifestation: segno
            role: jump_target
          -
            coordinate: [4, 1]
            id: "#repeat"
            role: jump
            targets:
              -
                label: Repeat
                manifestation: repeat_end
                repeat_count: 2
                to: "#verse"
          -
            coordinate: [8, 1]
            id: "#dal_segno"
            role: jump
            targets:
              -
                label: D.S.
                manifestation: dal_segno
                repeat_count: 1
                reset: false
                to: "#segno"
        id: "#verse"
        length: [8, 1]
        locked: true
        name: Verse
        offset: [4, 1]
        unit: quarters
    id: "#piece"
    length: [16, 1]
    name: Piece
    unit: quarters
timetoshare: "0.2.0"
