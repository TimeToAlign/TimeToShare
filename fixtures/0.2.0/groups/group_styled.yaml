graphical:
  order:
    "#group_1": ["#score", "#page", "#performance"]
  rules:
    -
      select:
        element: frame
      set: frame-highlight
    -
      select:
        addresses:
          -
            id: "#group_1"
            part: [name]
        element: name
      set:
        fill: "#7F00FF"
    -
      select:
        element: card
        inside: frame
      set:
        rx: 2
        shadow: "#C4B5FD"
  styles:
    frame-highlight:
      stroke: "#7F00FF"
  timestamps:
    -
      coordinate: 0
      display: [wedge, coordinate]
      id: "#timestamp_1"
      name: origin
      timeline: "#page"
    -
      coordinate: 1920
      display: [wedge, coordinate]
      id: "#timestamp_2"
      name: length
      timeline: "#page"
    -
      coordinate: 0.0
      display: [wedge, coordinate]
      id: "#timestamp_3"
      name: origin
      timeline: "#performance"
    -
      coordinate: 12.5
      display: [wedge, coordinate]
      id: "#timestamp_4"
      name: length
      timeline: "#performance"
    -
      coordinate: [0, 1]
      display: [wedge, coordinate]
      id: "#timestamp_5"
      name: origin
      timeline: "#score"
    -
      coordinate: [12, 1]
      display: [wedge, coordinate]
      id: "#timestamp_6"
      name: length
      timeline: "#score"
groups:
  -
    id: "#group_1"
    members: ["#page", "#performance", "#score"]
    meta: {}
    name: Edition
links: []
measure_maps: []
