"@context":
  "@version": 1.1
  actor:
    "@id": "https://timetoalign.github.io/timetoshare/ns#actor"
    "@type": "@id"
  basis:
    "@id": "http://www.w3.org/ns/prov#hadPrimarySource"
    "@type": "@id"
  belief:
    "@id": "https://timetoalign.github.io/timetoshare/ns#belief"
    "@type": "@vocab"
  beliefs: "https://timetoalign.github.io/timetoshare/ns#beliefs"
  broad: "http://www.w3.org/2004/02/skos/core#broadMatch"
  children: "@included"
  close: "http://www.w3.org/2004/02/skos/core#closeMatch"
  date:
    "@id": "http://purl.org/dc/terms/date"
    "@type": "http://www.w3.org/2001/XMLSchema#date"
  exact: "http://www.w3.org/2004/02/skos/core#exactMatch"
  "false": "https://timetoalign.github.io/timetoshare/ns#False"
  groups: "@included"
  id: "@id"
  imported: "https://timetoalign.github.io/timetoshare/ns#Imported"
  inferred: "https://timetoalign.github.io/timetoshare/ns#Inferred"
  label: "http://www.w3.org/2000/01/rdf-schema#label"
  list: "@list"
  manual: "https://timetoalign.github.io/timetoshare/ns#Manual"
  match:
    "@id": "https://timetoalign.github.io/timetoshare/ns#match"
    "@type": "@vocab"
  method:
    "@id": "https://timetoalign.github.io/timetoshare/ns#method"
    "@type": "@vocab"
  narrow: "http://www.w3.org/2004/02/skos/core#narrowMatch"
  note: "http://www.w3.org/2000/01/rdf-schema#comment"
  property:
    "@id": "http://www.w3.org/1999/02/22-rdf-syntax-ns#predicate"
    "@type": "@vocab"
  provenance:
    "@reverse": "http://www.w3.org/1999/02/22-rdf-syntax-ns#subject"
  reconciled: "https://timetoalign.github.io/timetoshare/ns#Reconciled"
  regions: "@included"
  related: "http://www.w3.org/2004/02/skos/core#relatedMatch"
  service:
    "@id": "https://timetoalign.github.io/timetoshare/ns#service"
    "@type": "@id"
  stated_by:
    "@id": "http://www.w3.org/ns/prov#wasAttributedTo"
    "@type": "@id"
  statements: "@nest"
  timelines: "@included"
  "true": "https://timetoalign.github.io/timetoshare/ns#True"
  type: "@type"
  unlikely: "https://timetoalign.github.io/timetoshare/ns#Unlikely"
  value: "http://www.w3.org/1999/02/22-rdf-syntax-ns#object"
graphical:
  order:
    "#group_1": ["#score", "#page", "#performance"]
  rules:
    -
      select:
        element: frame
      set: frame-highlight
    -
      select:
        addresses:
          -
            id: "#group_1"
            part: [name]
        element: name
      set:
        fill: "#7F00FF"
    -
      select:
        element: card
        inside: frame
      set:
        rx: 2
        shadow: "#C4B5FD"
  styles:
    frame-highlight:
      stroke: "#7F00FF"
  timestamps:
    -
      coordinate: 0
      display: [wedge, coordinate]
      id: "#timestamp_1"
      name: origin
      timeline: "#page"
    -
      coordinate: 1920
      display: [wedge, coordinate]
      id: "#timestamp_2"
      name: length
      timeline: "#page"
    -
      coordinate: 0.0
      display: [wedge, coordinate]
      id: "#timestamp_3"
      name: origin
      timeline: "#performance"
    -
      coordinate: 12.5
      display: [wedge, coordinate]
      id: "#timestamp_4"
      name: length
      timeline: "#performance"
    -
      coordinate: [0, 1]
      display: [wedge, coordinate]
      id: "#timestamp_5"
      name: origin
      timeline: "#score"
    -
      coordinate: [12, 1]
      display: [wedge, coordinate]
      id: "#timestamp_6"
      name: length
      timeline: "#score"
groups:
  -
    id: "#group_1"
    members: ["#page", "#performance", "#score"]
    name: Edition
meta:
  generator: "timetoalign 1.2.0 (40161e42)"
timelines:
  -
    conversion_maps:
      -
        id: "#cmap_3"
        scalar: [3, 4]
        source_unit: pixels
        target_unit: points
        type: LinearMap
    id: "#page"
    length: 1920
    name: Page
    unit: pixels
  -
    conversion_maps:
      -
        id: "#cmap_2"
        scalar: 44100
        source_unit: seconds
        target_unit: samples
        type: LinearMap
    id: "#performance"
    length: 12.5
    name: Performance
    unit: seconds
  -
    conversion_maps:
      -
        id: "#cmap_1"
        scalar: 480
        source_unit: quarters
        target_unit: ticks
        type: LinearMap
    flow_control:
      -
        coordinate: [8, 1]
        id: "#jump_from_1"
        label: Repeat
        role: jump
        targets:
          -
            manifestation: repeat_end
            repeat_count: 1
    id: "#score"
    length: [12, 1]
    name: Score
    regions:
      -
        end: [8, 1]
        id: "#region_1"
        name: Theme
        start: [0, 1]
    unit: quarters
timetoshare: "0.2.0"
