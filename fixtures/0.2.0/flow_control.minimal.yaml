graphical:
  timestamps:
    -
      coordinate: [0, 1]
      display: [wedge, coordinate]
      id: "#timestamp_1"
      name: origin
      timeline: "#flow:quarters"
    -
      coordinate: [16, 1]
      display: [wedge, coordinate]
      id: "#timestamp_2"
      name: length
      timeline: "#flow:quarters"
meta:
  generator: "timetoalign 1.2.0 (40161e42)"
timelines:
  -
    flow_control:
      -
        coordinate: [2, 1]
        id: "#jump_to_1"
        manifestation: repeat_start
        name: repeat-start
        role: jump_target
      -
        coordinate: [4, 1]
        id: "#jump_to_2"
        manifestation: segno
        name: segno
        role: jump_target
      -
        coordinate: [8, 1]
        id: "#jump_from_1"
        label: Repeat
        meta:
          source: synthetic
        role: jump
        targets:
          -
            manifestation: repeat_end
            repeat_count: 2
            to: "#jump_to_1"
      -
        coordinate: [12, 1]
        ends:
          after:
            jump: "#jump_from_2"
        id: "#flow_marker_1"
        label: Fine
        manifestation: fine
        meta:
          source: synthetic
        name: fine
        role: break
      -
        coordinate: [16, 1]
        id: "#jump_from_2"
        label: D.S.
        role: jump
        targets:
          -
            manifestation: dal_segno
            repeat_count: 1
            reset: false
            to: "#jump_to_2"
    id: "#flow:quarters"
    length: [16, 1]
    name: "Flow control"
    unit: quarters
timetoshare: "0.2.0"
