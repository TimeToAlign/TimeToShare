manifests:
  -
    media_type: application/yaml
    url: bach/manifest.yaml
  -
    media_type: application/yaml
    url: handel/manifest.yaml
name: "Two manifests sharing their registry and tables"
tables:
  -
    media_type: application/vnd.apache.parquet
    type: Registry
    url: registry.parquet
  -
    media_type: application/vnd.apache.parquet
    type: Parse
    url: tables/parses.parquet
  -
    media_type: application/vnd.apache.parquet
    type: MatchClaim
    url: tables/MatchClaim/
  -
    media_type: application/vnd.apache.parquet
    type: Note
    url: tables/Note/
  -
    media_type: application/vnd.apache.parquet
    type: Note
    url: tables/Note/part_b.parquet
timetoshare: "0.2.0"
